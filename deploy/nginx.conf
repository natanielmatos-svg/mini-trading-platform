# Nginx delante de la app. Sustituye TU-DOMINIO.com por tu dominio real.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/mini-trading-platform
#   sudo ln -s /etc/nginx/sites-available/mini-trading-platform /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d TU-DOMINIO.com
#
# Certbot reescribe este archivo para añadir el bloque TLS y la redirección
# desde el puerto 80; por eso aquí sólo aparece el servidor en claro.

upstream mini_trading_platform {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name TU-DOMINIO.com;

    # El analizador devuelve JSON de decenas de kB; comprimir se nota.
    gzip on;
    gzip_types application/json text/css application/javascript text/html;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Una consulta fría consulta tres APIs externas en paralelo; 30 s de margen
    # cubre el caso lento sin dejar conexiones colgadas para siempre.
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    location / {
        proxy_pass http://mini_trading_platform;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sonda de vida: sin logs, para no llenar el access.log de ruido.
    location = /healthz {
        proxy_pass http://mini_trading_platform;
        proxy_set_header Host $host;
        access_log off;
    }
}
